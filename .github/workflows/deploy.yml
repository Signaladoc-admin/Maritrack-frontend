name: Deploy Maritrack Frontend

on:
  push:
    branches:
      - dev/dev
  workflow_dispatch:

concurrency:
  group: maritrack-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Lint
      #   run: npm run lint

      # - name: Test
      #   run: npm test

      # Dotfiles alone are not always enough for next build to see NEXT_PUBLIC_* in CI.
      # Export every NEXT_PUBLIC_* from VPS_DOTENV into this shell before npm run build.
      - name: Build application
        env:
          VPS_DOTENV: ${{ secrets.VPS_DOTENV }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          if [ -z "${VPS_DOTENV}" ]; then
            echo "VPS_DOTENV secret is empty. It must include NEXT_PUBLIC_API_URL (and other keys)."
            exit 1
          fi
          printf '%s\n' "$VPS_DOTENV" > .env.production.local
          ENV_EXPORT_SCRIPT="/tmp/maritrack-next-public-env-$$.sh"
          python3 << 'PY' > "$ENV_EXPORT_SCRIPT"
          import re
          import pathlib
          import shlex
          import sys

          raw = pathlib.Path(".env.production.local").read_text(encoding="utf-8")
          lines = ["#!/bin/sh", "set -e"]
          pat = re.compile(r"^(?:export\s+)?([\w.-]+)\s*=\s*(.*)$")
          found_api = False
          for line in raw.splitlines():
              t = line.strip()
              if not t or t.startswith("#"):
                  continue
              m = pat.match(t)
              if not m:
                  continue
              key, val = m.group(1), m.group(2).strip()
              if not key.startswith("NEXT_PUBLIC_"):
                  continue
              if key == "NEXT_PUBLIC_API_URL":
                  found_api = True
              if (val.startswith('"') and val.endswith('"')) or (val.startswith("'") and val.endswith("'")):
                  val = val[1:-1]
              lines.append(f"export {key}={shlex.quote(val)}")
          if not found_api:
              print("VPS_DOTENV must include NEXT_PUBLIC_API_URL=...", file=sys.stderr)
              sys.exit(1)
          print("\n".join(lines))
          PY
          chmod +x "$ENV_EXPORT_SCRIPT"
          . "$ENV_EXPORT_SCRIPT"
          rm -f "$ENV_EXPORT_SCRIPT"
          : "${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL was not set from VPS_DOTENV}"
          npm run build

      - name: Prepare standalone release
        env:
          VPS_DOTENV: ${{ secrets.VPS_DOTENV }}
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/.next
          cp -R .next/standalone/. deploy/
          cp -R .next/static deploy/.next/static
          cp -R public deploy/public
          cp ecosystem.config.cjs deploy/ecosystem.config.cjs
          printf '%s\n' "$VPS_DOTENV" > deploy/.env

      - name: Deploy release
        env:
          RSA_SECRET: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          INSTALL_PATH: ${{ secrets.INSTALL_PATH }}
        run: |
          set -euo pipefail

          : "${RSA_SECRET:?RSA_SECRET secret is required}"
          : "${SSH_KNOWN_HOSTS:?SSH_KNOWN_HOSTS secret is required}"
          : "${VPS_HOST:?VPS_HOST secret is required}"
          : "${VPS_USER:?VPS_USER secret is required}"
          : "${SSH_PORT:?SSH_PORT secret is required}"
          : "${INSTALL_PATH:?INSTALL_PATH secret is required}"

          mkdir -p ~/.ssh
          printf '%s\n' "$RSA_SECRET" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts

          SSH=(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          REMOTE="${VPS_USER}@${VPS_HOST}"
          RELEASE_ID="${GITHUB_SHA::12}"
          RELEASE_DIR="${INSTALL_PATH}/releases/${RELEASE_ID}"

          "${SSH[@]}" "$REMOTE" "mkdir -p '$INSTALL_PATH/releases' '$RELEASE_DIR'"
          rsync -az --delete -e "${SSH[*]}" deploy/ "${REMOTE}:${RELEASE_DIR}/"
          "${SSH[@]}" "$REMOTE" "INSTALL_PATH='$INSTALL_PATH' RELEASE_ID='$RELEASE_ID' bash -s" <<'EOF'
            set -euo pipefail

            RELEASE_DIR="${INSTALL_PATH}/releases/${RELEASE_ID}"

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "pm2 is not installed on the server" >&2
              exit 1
            fi

            ln -sfn "$RELEASE_DIR" "${INSTALL_PATH}/current"
            cd "${INSTALL_PATH}/current"
            pm2 startOrReload ecosystem.config.cjs --update-env

            find "${INSTALL_PATH}/releases" -mindepth 1 -maxdepth 1 -type d | sort -r | tail -n +6 | xargs -r rm -rf
          EOF
