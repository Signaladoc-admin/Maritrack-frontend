name: Deploy Maritrack Frontend

on:
  push:
    branches:
      - dev/dev
  workflow_dispatch:

concurrency:
  group: maritrack-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Lint
      #   run: npm run lint

      # - name: Test
      #   run: npm test

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache key whenever packages or source files change
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # NEXT_PUBLIC_* is read at `next build` from .env.production.local (same source as deploy/.env).
      - name: Build application
        env:
          VPS_DOTENV: ${{ secrets.VPS_DOTENV }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          if [ -z "${VPS_DOTENV}" ]; then
            echo "VPS_DOTENV secret is empty. It must include NEXT_PUBLIC_API_URL (and other keys)."
            exit 1
          fi
          printf '%s\n' "$VPS_DOTENV" > .env.production.local
          if ! grep -Eq '^[[:space:]]*(export[[:space:]]+)?NEXT_PUBLIC_API_URL=.+' .env.production.local; then
            echo "VPS_DOTENV must define a non-empty NEXT_PUBLIC_API_URL=... line for the client bundle."
            exit 1
          fi
          npm run build

      - name: Prepare standalone release
        env:
          VPS_DOTENV: ${{ secrets.VPS_DOTENV }}
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/.next
          cp -R .next/standalone/. deploy/
          cp -R .next/static deploy/.next/static
          cp -R public deploy/public
          cp ecosystem.config.cjs deploy/ecosystem.config.cjs
          printf '%s\n' "$VPS_DOTENV" > deploy/.env

      - name: Deploy release
        env:
          RSA_SECRET: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          INSTALL_PATH: ${{ secrets.INSTALL_PATH }}
        run: |
          set -euo pipefail

          : "${RSA_SECRET:?RSA_SECRET secret is required}"
          : "${VPS_HOST:?VPS_HOST secret is required}"
          : "${VPS_USER:?VPS_USER secret is required}"
          : "${SSH_PORT:?SSH_PORT secret is required}"
          : "${INSTALL_PATH:?INSTALL_PATH secret is required}"

          mkdir -p ~/.ssh
          printf '%s\n' "$RSA_SECRET" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi
          
          # Dynamically scan and append host keys (e.g. ED25519) to prevent verification failures
          ssh-keyscan -p "$SSH_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          SSH=(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          REMOTE="${VPS_USER}@${VPS_HOST}"
          RELEASE_ID="${GITHUB_SHA::12}"
          RELEASE_DIR="${INSTALL_PATH}/releases/${RELEASE_ID}"

          "${SSH[@]}" "$REMOTE" "mkdir -p '$INSTALL_PATH/releases' '$RELEASE_DIR'"
          rsync -az --delete -e "${SSH[*]}" deploy/ "${REMOTE}:${RELEASE_DIR}/"
          "${SSH[@]}" "$REMOTE" "INSTALL_PATH='$INSTALL_PATH' RELEASE_ID='$RELEASE_ID' bash -s" <<'EOF'
            set -euo pipefail

            # 1. Load NVM (Node Version Manager) if installed
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              set +e
              . "$NVM_DIR/nvm.sh"
              set -e
            fi

            # 2. Append common binary directories (including /snap/bin) to PATH
            export PATH="$PATH:/usr/local/bin:/snap/bin:$HOME/.npm-global/bin:$HOME/.local/bin"

            # 3. Dynamically search for PM2 in common installation directories
            for candidate in \
              /snap/bin/pm2 \
              /usr/bin/pm2 \
              /usr/local/bin/pm2 \
              "$HOME"/.nvm/versions/node/*/bin/pm2 \
              "$HOME"/.fnm/aliases/default/bin/pm2 \
              "$HOME"/.fnm/bin/pm2 \
              "$HOME"/.npm-global/bin/pm2 \
              "$HOME"/.config/yarn/global/node_modules/.bin/pm2 \
              "$HOME"/.yarn/bin/pm2
            do
              if [ -x "$candidate" ]; then
                export PATH="$(dirname "$candidate"):$PATH"
                break
              fi
            done

            RELEASE_DIR="${INSTALL_PATH}/releases/${RELEASE_ID}"

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "Error: pm2 is not found in PATH ($PATH) on the server." >&2
              exit 1
            fi

            ln -sfn "$RELEASE_DIR" "${INSTALL_PATH}/current"
            cd "${INSTALL_PATH}/current"
            pm2 startOrReload ecosystem.config.cjs --update-env

            find "${INSTALL_PATH}/releases" -mindepth 1 -maxdepth 1 -type d | sort -r | tail -n +6 | xargs -r rm -rf
          EOF
