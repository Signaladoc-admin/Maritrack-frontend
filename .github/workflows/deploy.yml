name: Build + Deploy dev

on:
    push:
        branches: ["dev/dev"]

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

env:
    IMAGE_BASE: ghcr.io/signaladoc-team/maritrackfrontend/optitrack-frontend
    SERVICE_NAME: optitrack-frontend

jobs:
    # ───────────────────────────── BUILD & PUSH ─────────────────────────────
    build:
        runs-on: ubuntu-latest
        environment: dev
        permissions:
            contents: read
            packages: write

        outputs:
            image_digest: ${{ steps.bp.outputs.digest }}

        steps:
            - uses: actions/checkout@v4

            - name: Docker login → GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  # username: ${{ github.actor }}
                  # password: ${{ secrets.GITHUB_TOKEN }}
                  username: ${{ secrets.GHCR_USERNAME }}
                  password: ${{ secrets.GHCR_PULL_TOKEN }}

            - name: Set up Docker Buildx (BuildKit)
              uses: docker/setup-buildx-action@v3
              with:
                  driver: docker-container
                  install: true
                  buildkitd-flags: --debug

            - name: Docker meta (tags + labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_BASE }}
                  tags: |
                      type=raw,value=main
                      type=sha
                  labels: |
                      org.opencontainers.image.source=${{ github.repository }}

            - name: Build & Push
              id: bp
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  # NEXT_PUBLIC_* vars are inlined into the JS bundle at `next build`.
                  # They CANNOT be overridden at runtime via --env-file or docker env.
                  # They MUST be supplied here as build-args.
                  build-args: |
                      NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
                      NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
                      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}

            - name: Write image digest to workflow summary
              run: |
                  echo "### Built image digest" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "\`${{ env.IMAGE_BASE }}@${{ steps.bp.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "Copy the digest value and use it when you run the **Web Deploy (prod)** workflow." >> "$GITHUB_STEP_SUMMARY"

    # ──────────────────────────── DEPLOY → DEV ─────────────────────────────
    deploy-dev:
        needs: build
        runs-on: ubuntu-latest
        environment: dev
        permissions:
            contents: read
            packages: read

        env:
            REGISTRY: ghcr.io

        steps:
            - name: Create per-app digest override
              run: |
                  {
                    echo "services:"
                    echo "  ${{env.SERVICE_NAME}}:"
                    echo "    image: ${{ env.IMAGE_BASE }}@${{ needs.build.outputs.image_digest }}"
                    echo "  ${{env.SERVICE_NAME}}-migrate:"
                    echo "    image: ${{ env.IMAGE_BASE }}@${{ needs.build.outputs.image_digest }}"
                  } > docker-compose.${{env.SERVICE_NAME}}.override.yml
                  cat docker-compose.${{env.SERVICE_NAME}}.override.yml

            - name: Copy override to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST_VPS }}
                  username: ${{ secrets.SSH_USER_VPS }}
                  key: ${{ secrets.SSH_KEY_VPS }}
                  source: "docker-compose.${{env.SERVICE_NAME}}.override.yml"
                  target: /home/dockeradmin/flentra/frontend/.deploy
                  overwrite: true

            - name: Deploy ${{env.SERVICE_NAME}}
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST_VPS }}
                  username: ${{ secrets.SSH_USER_VPS }}
                  key: ${{ secrets.SSH_KEY_VPS }}
                  # fingerprint: ${{ secrets.SSH_FINGERPRINT }}  # enable once set
                  script: |
                      set -euo pipefail

                      # Log in to GHCR on the host
                      echo '${{ secrets.GHCR_PULL_TOKEN }}' | docker login -u '${{ github.actor }}' --password-stdin "${{ env.REGISTRY }}"

                      # Use infra + app + per-app override (pin by digest)
                      docker compose \
                        --env-file /home/dockeradmin/flentra/frontend/apps/${{env.SERVICE_NAME}}.env \
                        -f /home/dockeradmin/flentra/frontend/compose/docker-compose.${{env.SERVICE_NAME}}.yml \
                        -f /home/dockeradmin/flentra/frontend/.deploy/docker-compose.${{env.SERVICE_NAME}}.override.yml \
                        pull ${{env.SERVICE_NAME}}

                      docker compose \
                        --env-file /home/dockeradmin/flentra/frontend/apps/${{env.SERVICE_NAME}}.env \
                        -f /home/dockeradmin/flentra/frontend/compose/docker-compose.${{env.SERVICE_NAME}}.yml \
                        -f /home/dockeradmin/flentra/frontend/.deploy/docker-compose.${{env.SERVICE_NAME}}.override.yml \
                        up -d --wait --wait-timeout 180 ${{env.SERVICE_NAME}}

                      docker image prune -f







