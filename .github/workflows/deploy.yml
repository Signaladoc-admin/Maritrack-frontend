name: Deploy Maritrack

on:
  push:
    branches:
      - dev/dev
  workflow_dispatch:

concurrency:
  group: maritrack-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Lint
      #   run: npm run lint

      # - name: Test
      #   run: npm test

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare standalone release
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/.next
          cp -R .next/standalone/. deploy/
          cp -R .next/static deploy/.next/static
          cp -R public deploy/public
          cp ecosystem.config.cjs deploy/ecosystem.config.cjs

      - name: Deploy release
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          INSTALL_PATH: ${{ secrets.INSTALL_PATH }}
        run: |
          set -euo pipefail

          : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY secret is required}"
          : "${SSH_KNOWN_HOSTS:?SSH_KNOWN_HOSTS secret is required}"
          : "${SERVER_IP:?SERVER_IP secret is required}"
          : "${SSH_USER:?SSH_USER secret is required}"
          : "${INSTALL_PATH:?INSTALL_PATH secret is required}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts

          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          REMOTE="${SSH_USER}@${SERVER_IP}"
          RELEASE_ID="${GITHUB_SHA::12}"
          RELEASE_DIR="${INSTALL_PATH}/releases/${RELEASE_ID}"

          "${SSH[@]}" "$REMOTE" "mkdir -p '$INSTALL_PATH/releases' '$RELEASE_DIR'"
          rsync -az --delete -e "${SSH[*]}" deploy/ "${REMOTE}:${RELEASE_DIR}/"
          "${SSH[@]}" "$REMOTE" "INSTALL_PATH='$INSTALL_PATH' RELEASE_ID='$RELEASE_ID' bash -s" <<'EOF'
            set -euo pipefail

            RELEASE_DIR="${INSTALL_PATH}/releases/${RELEASE_ID}"

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "pm2 is not installed on the server" >&2
              exit 1
            fi

            ln -sfn "$RELEASE_DIR" "${INSTALL_PATH}/current"
            cd "${INSTALL_PATH}/current"
            pm2 startOrReload ecosystem.config.cjs --update-env

            find "${INSTALL_PATH}/releases" -mindepth 1 -maxdepth 1 -type d | sort -r | tail -n +6 | xargs -r rm -rf
          EOF
